name: clove
description: "Clove - Multi-Vendor E-Commerce Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core packages
  provider: ^6.0.0
  dio: ^5.3.1
  get_it: ^7.6.0
  
  # Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # UI & Navigation
  go_router: ^11.1.3
  flutter_svg: ^2.0.7
  intl: ^0.18.1
  
  # State management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  riverpod_generator: ^2.3.1
  
  # Utilities
  uuid: ^4.0.0
  freezed_annotation: ^2.4.1
  json_serializable: ^6.7.1
  
  # Payment
  webview_flutter: ^4.2.4
  
  # Image
  cached_network_image: ^3.3.0
  image_picker: ^1.0.4
  
  # Notifications
  firebase_core: ^2.24.2
  firebase_messaging: ^14.6.4
  
  # Analytics
  firebase_analytics: ^10.4.5
  
  # Logging
  logger: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  freezed: ^2.4.1
  hive_generator: ^2.0.1
  riverpod_generator: ^2.3.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
